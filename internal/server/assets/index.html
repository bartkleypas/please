<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please - Narrative Graph</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #11261d 0%, #08120e 100%);
            background-attachment: fixed;
            color: #e0e7e3;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #4ade80;
            font-size: 1.8rem;
            font-weight: 700;
            border-bottom: 1px solid #1e3a2f;
            padding-bottom: 15px;
            margin-bottom: 30px;
            letter-spacing: -0.025em;
        }
        .node {
            margin-left: 24px;
            border-left: 2px solid #1e3a2f;
            padding-left: 24px;
            margin-top: 24px;
            transition: border-color 0.2s ease;
        }
        .node:hover {
            border-left-color: #4ade80;
        }
        .node.root {
            margin-left: 0;
            border-left: none;
            padding-left: 0;
            margin-top: 16px;
        }
        .toggle-btn {
            cursor: pointer;
            color: #8fa397;
            font-family: monospace;
            font-size: 1rem;
            user-select: none;
            margin-right: 8px;
            transition: color 0.2s;
        }
        .toggle-btn:hover {
            color: #e2e8f0;
        }
        .node-header {
            font-size: 0.75rem;
            color: #8fa397;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .role {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
        }
        .role-system { color: #facc15; }
        .role-user { color: #60a5fa; }
        .role-assistant { color: #4ade80; }
        .role-tool { color: #c084fc; }
        
        .thought {
            font-size: 0.85rem;
            font-style: italic;
            color: #64748b;
            margin-bottom: 10px;
            padding-left: 12px;
            border-left: 2px solid #334155;
            white-space: pre-wrap;
        }

        .content {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            background: rgba(22, 44, 35, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(30, 58, 47, 0.5) inset;
            border: 1px solid rgba(45, 90, 69, 0.3);
            color: #e2e8f0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .content:hover {
            box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(74, 222, 128, 0.2) inset;
        }
        .content.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .node-id {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: #1e3a2f;
            color: #4ade80;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .timestamp {
            opacity: 0.7;
        }
        .meta {
            margin-top: 8px;
            font-size: 0.8rem;
        }
        .bookmark { 
            color: #facc15;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦉 Please Narrative Graph</h1>
        <div id="graph-container">Loading graph...</div>
    </div>

    <script>
        async function fetchGraph() {
            try {
                const response = await fetch('/api/graph');
                const data = await response.json();
                renderGraph(data);
            } catch (error) {
                console.error('Error fetching graph:', error);
                document.getElementById('graph-container').innerText = 'Error loading graph.';
            }
        }

        // Memoization for subtree activity timestamps
        function getLatestActivity(nodeID, graph, memo) {
            if (memo[nodeID]) return memo[nodeID];
            
            const node = graph.Nodes[nodeID];
            if (!node) return 0;

            let latest = new Date(node.timestamp).getTime();
            
            const childrenIDs = graph.Children[nodeID] || [];
            childrenIDs.forEach(childID => {
                latest = Math.max(latest, getLatestActivity(childID, graph, memo));
            });

            memo[nodeID] = latest;
            return latest;
        }

        function renderGraph(graph) {
            const container = document.getElementById('graph-container');
            container.innerHTML = '';

            if (!graph.Roots || graph.Roots.length === 0) {
                container.innerText = 'No nodes found in graph.';
                return;
            }

            const memo = {};
            // Sort roots by latest activity in their subtree (descending)
            const sortedRoots = [...graph.Roots].sort((a, b) => {
                return getLatestActivity(b, graph, memo) - getLatestActivity(a, graph, memo);
            });

            sortedRoots.forEach(rootID => {
                const rootNode = graph.Nodes[rootID];
                if (rootNode) {
                    container.appendChild(createNodeElement(rootNode, graph, memo, true));
                }
            });
        }

        function createNodeElement(node, graph, memo, isRoot = false) {
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'node' + (isRoot ? ' root' : '');

            const header = document.createElement('div');
            header.className = 'node-header';
            
            const roleSpan = document.createElement('span');
            roleSpan.className = `role role-${node.role}`;
            roleSpan.innerText = node.role;

            const idSpan = document.createElement('span');
            idSpan.className = 'node-id';
            idSpan.innerText = node.id.slice(-8);
            idSpan.style.marginLeft = '10px';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'timestamp';
            timeSpan.innerText = new Date(node.timestamp).toLocaleString();
            timeSpan.style.marginLeft = '10px';

            header.appendChild(roleSpan);
            header.appendChild(idSpan);
            header.appendChild(timeSpan);

            if (node.metadata && node.metadata.bookmarked === "true") {
                const bookmark = document.createElement('span');
                bookmark.className = 'bookmark';
                bookmark.innerText = ' ⭐';
                header.appendChild(bookmark);
            }

            nodeDiv.appendChild(header);

            if (node.thought) {
                const thoughtToggleBtn = document.createElement('span');
                thoughtToggleBtn.className = 'toggle-btn';
                thoughtToggleBtn.innerText = '🧠';
                thoughtToggleBtn.title = 'Toggle thought process';
                thoughtToggleBtn.style.marginLeft = '10px';
                thoughtToggleBtn.style.opacity = '0.4';
                thoughtToggleBtn.style.transition = 'opacity 0.2s';
                
                const thought = document.createElement('div');
                thought.className = 'thought';
                thought.innerText = node.thought;
                thought.style.display = 'none';

                thoughtToggleBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (thought.style.display === 'none') {
                        thought.style.display = 'block';
                        thoughtToggleBtn.style.opacity = '1';
                    } else {
                        thought.style.display = 'none';
                        thoughtToggleBtn.style.opacity = '0.4';
                    }
                };

                header.appendChild(thoughtToggleBtn);
                nodeDiv.appendChild(thought);
            }

            const content = document.createElement('div');
            content.className = 'content';
            content.innerText = node.content;

            if (node.images && node.images.length > 0) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'image-container';
                imgContainer.style.display = 'flex';
                imgContainer.style.flexWrap = 'wrap';
                imgContainer.style.gap = '15px';
                imgContainer.style.marginTop = '12px';

                node.images.forEach(img => {
                    const imgWrapper = document.createElement('div');
                    imgWrapper.style.display = 'flex';
                    imgWrapper.style.flexDirection = 'column';
                    imgWrapper.style.gap = '6px';
                    
                    const imgEl = document.createElement('img');
                    imgEl.src = `/api/image?path=${encodeURIComponent(img)}`;
                    imgEl.style.maxWidth = '240px';
                    imgEl.style.maxHeight = '240px';
                    imgEl.style.borderRadius = '8px';
                    imgEl.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                    imgEl.style.cursor = 'pointer';
                    imgEl.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06)';
                    imgEl.onclick = () => window.open(`/api/image?path=${encodeURIComponent(img)}`, '_blank');
                    imgWrapper.appendChild(imgEl);

                    if (node.metadata && node.metadata.sd_prompt) {
                        const metaBadge = document.createElement('div');
                        metaBadge.style.fontSize = '0.75rem';
                        metaBadge.style.background = 'rgba(0, 0, 0, 0.4)';
                        metaBadge.style.color = '#86efac';
                        metaBadge.style.padding = '8px 12px';
                        metaBadge.style.borderRadius = '6px';
                        metaBadge.style.border = '1px solid rgba(134, 239, 172, 0.2)';
                        metaBadge.style.maxWidth = '216px';
                        metaBadge.style.wordBreak = 'break-word';

                        let metaHtml = `<strong>Prompt:</strong> ${node.metadata.sd_prompt}`;
                        if (node.metadata.sd_seed) metaHtml += `<br><strong>Seed:</strong> ${node.metadata.sd_seed}`;
                        if (node.metadata.sd_sampler) metaHtml += `<br><strong>Sampler:</strong> ${node.metadata.sd_sampler}`;
                        if (node.metadata.sd_cfg_scale) metaHtml += `<br><strong>CFG:</strong> ${node.metadata.sd_cfg_scale}`;
                        if (node.metadata.sd_steps) metaHtml += `<br><strong>Steps:</strong> ${node.metadata.sd_steps}`;
                        if (node.metadata.sd_model) metaHtml += `<br><strong>Model:</strong> ${node.metadata.sd_model}`;

                        metaBadge.innerHTML = metaHtml;
                        imgWrapper.appendChild(metaBadge);
                    }

                    imgContainer.appendChild(imgWrapper);
                });
                content.appendChild(imgContainer);
            }

            nodeDiv.appendChild(content);

            const childrenIDs = graph.Children[node.id] || [];
            
            if (childrenIDs.length > 0) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'children-container';

                const toggleBtn = document.createElement('span');
                toggleBtn.className = 'toggle-btn';
                toggleBtn.innerText = '[-]';
                toggleBtn.title = 'Toggle children';
                toggleBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (childrenContainer.style.display === 'none') {
                        childrenContainer.style.display = 'block';
                        toggleBtn.innerText = '[-]';
                        content.classList.remove('clamped');
                    } else {
                        childrenContainer.style.display = 'none';
                        toggleBtn.innerText = '[+]';
                        content.classList.add('clamped');
                    }
                };
                header.prepend(toggleBtn);

                // Sort children by latest activity in their subtree (descending)
                const sortedChildrenIDs = [...childrenIDs].sort((a, b) => {
                    return getLatestActivity(b, graph, memo) - getLatestActivity(a, graph, memo);
                });

                sortedChildrenIDs.forEach(childID => {
                    const childNode = graph.Nodes[childID];
                    if (childNode) {
                        childrenContainer.appendChild(createNodeElement(childNode, graph, memo));
                    }
                });
                
                nodeDiv.appendChild(childrenContainer);
            }

            return nodeDiv;
        }

        // Initial fetch
        fetchGraph();
        // Polling removed per user request
    </script>
</body>
</html>
